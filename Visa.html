<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奥地利申根签证材料清单</title>
<style>
  :root {
    --navy: #14243f;
    --navy-deep: #0d1a2e;
    --parchment: #f7f2e7;
    --parchment-line: #e5dcc7;
    --brass: #a9812d;
    --brass-dim: #cdb27a;
    --burgundy: #7a2e2e;
    --ink: #2b2b26;
    --ink-soft: #6b6558;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--navy-deep);
    font-family: Georgia, 'Songti SC', 'Noto Serif SC', serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
  }

  .sheet {
    width: 100%;
    max-width: 720px;
    background: var(--parchment);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
  }

  header {
    background: var(--navy);
    color: var(--parchment);
    padding: 32px 36px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    border-bottom: 3px double var(--brass-dim);
  }

  .title-block .eyebrow {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass-dim);
    margin: 0 0 8px;
  }

  .title-block h1 {
    margin: 0 0 10px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .title-block .meta {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 13px;
    color: #c7d0dd;
    line-height: 1.7;
  }

  .ring-wrap {
    position: relative;
    width: 92px;
    height: 92px;
    flex-shrink: 0;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-bg { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 7; }
  .ring-fg {
    fill: none;
    stroke: var(--brass-dim);
    stroke-width: 7;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s ease;
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  }

  .ring-label .pct { font-size: 18px; font-weight: 700; line-height: 1; }
  .ring-label .cap { font-size: 9px; color: var(--brass-dim); margin-top: 3px; letter-spacing: 0.05em; }

  main { padding: 8px 36px 12px; }

  .section {
    padding: 22px 0;
    border-bottom: 1px solid var(--parchment-line);
  }
  .section:last-of-type { border-bottom: none; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.01em;
  }

  .section-head .count {
    font-family: 'SF Mono', Consolas, 'Courier New', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  ul.items { list-style: none; margin: 0; padding: 0; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .item:hover { background: rgba(169,129,45,0.08); }

  .item input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 19px;
    height: 19px;
    margin-top: 2px;
    flex-shrink: 0;
    border: 2px solid var(--navy);
    border-radius: 3px;
    position: relative;
    cursor: pointer;
    background: #fff;
  }

  .item input[type="checkbox"]:checked {
    background: var(--brass);
    border-color: var(--brass);
  }

  .item input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .item .text {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .item .label { color: var(--ink); }
  .item .note { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .item input:checked ~ .text .label {
    color: #9a9384;
    text-decoration: line-through;
    text-decoration-color: var(--brass-dim);
  }

  .flag {
    display: inline-block;
    margin-left: 8px;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: #fff;
    background: var(--burgundy);
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.03em;
    vertical-align: middle;
  }

  footer {
    padding: 20px 36px 30px;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.7;
    border-top: 1px dashed var(--parchment-line);
  }

  .stamp {
    position: absolute;
    margin-top: -6px;
    margin-left: 0;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; border-radius: 0; max-width: 100%; }
    .ring-wrap { display: none; }
    .item:hover { background: none; }
  }

  @media (max-width: 480px) {
    header { flex-direction: column; align-items: flex-start; }
    .ring-wrap { align-self: flex-end; margin-top: -50px; }
    main, header, footer { padding-left: 22px; padding-right: 22px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <div class="title-block">
      <p class="eyebrow">Schengen Visa · Österreich</p>
      <h1>奥地利申根签证材料清单</h1>
      <p class="meta">
        VFS Global San Francisco · 642 Harrison Street, Suite 200<br>
        预约日期：2026年7月31日 &nbsp;|&nbsp; 行程：10/23–11/8（维也纳 + 哈尔施塔特为主目的地）
      </p>
    </div>
    <div class="ring-wrap">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <circle class="ring-bg" cx="46" cy="46" r="40"></circle>
        <circle class="ring-fg" id="ring" cx="46" cy="46" r="40" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
      </svg>
      <div class="ring-label">
        <span class="pct" id="pct">0%</span>
        <span class="cap" id="frac">0/19</span>
      </div>
    </div>
  </header>

  <main>

    <div class="section">
      <div class="section-head">
        <h2>身份材料</h2>
        <span class="count" data-group="id">0/7</span>
      </div>
      <ul class="items" data-group="id">
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">签证申请表</span><span class="note">填写完整并签字，签名需与护照一致</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">VFS 预约确认信</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">原始护照</span><span class="note">有效期至少到 2027/2/8；至少 2 页空白签证页；10 年内签发</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">护照个人信息页复印件</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">证件照</span><span class="note">符合 ICAO 标准，6 个月内拍摄</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">美国身份证明（H1B）</span><span class="note">原件 + 复印件</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">美国居住证明</span><span class="note">驾照（含现地址）或租房合同，原件 + 复印件</span></span>
        </label></li>
      </ul>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>行程与住宿</h2>
        <span class="count" data-group="trip">0/6</span>
      </div>
      <ul class="items" data-group="trip">
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">往返机票行程单</span><span class="note">SFO→BUD, PRG→SFO</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">申根区详细行程单</span><span class="note">布达佩斯 → 维也纳 → 哈尔施塔特 → 布拉格，逐日列明</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">布达佩斯住宿确认</span><span class="note">Párisi Udvar，10/24–29</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">维也纳住宿确认</span><span class="note">Hyatt Regency Vienna，10/29–11/3</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">哈尔施塔特住宿确认<span class="flag">待预订</span></span><span class="note">Seehotel Grüner Baum 或 Heritage Hotel Hallstatt，11/3–5</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">布拉格住宿确认</span><span class="note">Linder Hotel Prague Castle，11/5–8</span></span>
        </label></li>
      </ul>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>保险与资金证明</h2>
        <span class="count" data-group="funds">0/3</span>
      </div>
      <ul class="items" data-group="funds">
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">申根旅行医疗保险单</span><span class="note">保额 ≥ EUR 30,000（建议 50,000），无免赔额，含遗体遣返，覆盖 10/23–11/8 全程</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">近 3 个月银行流水</span><span class="note">需显示姓名与地址</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">近 3 个月工资单 / 收入证明</span></span>
        </label></li>
      </ul>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>费用</h2>
        <span class="count" data-group="fee">0/1</span>
      </div>
      <ul class="items" data-group="fee">
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">签证费 + VFS 服务费</span><span class="note">现金或 money order，不收信用卡，建议提前确认金额</span></span>
        </label></li>
      </ul>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>加分材料（建议准备）</h2>
        <span class="count" data-group="bonus">0/2</span>
      </div>
      <ul class="items" data-group="bonus">
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">雇主准假信</span><span class="note">注明职位、薪资、批准假期、确认休假后返岗</span></span>
        </label></li>
        <li class="item"><label style="display:flex; gap:12px; width:100%;">
          <input type="checkbox"><span class="text"><span class="label">加拿大 / 日本多次往返签证复印件</span></span>
        </label></li>
      </ul>
    </div>

  </main>

  <footer>
    勾选状态仅保存在当前浏览器标签页中，关闭或刷新页面后会重置——建议一次性核对完，或直接打印本页手动打勾（Cmd/Ctrl + P）。
  </footer>
</div>

<script>
  const allBoxes = Array.from(document.querySelectorAll('.item input[type="checkbox"]'));
  const ring = document.getElementById('ring');
  const pctLabel = document.getElementById('pct');
  const fracLabel = document.getElementById('frac');
  const circumference = 251.2;

  function update() {
    const total = allBoxes.length;
    const checked = allBoxes.filter(b => b.checked).length;
    const pct = total ? checked / total : 0;

    ring.style.strokeDashoffset = circumference - pct * circumference;
    pctLabel.textContent = Math.round(pct * 100) + '%';
    fracLabel.textContent = checked + '/' + total;

    document.querySelectorAll('ul.items[data-group]').forEach(list => {
      const group = list.dataset.group;
      const boxes = Array.from(list.querySelectorAll('input[type="checkbox"]'));
      const done = boxes.filter(b => b.checked).length;
      const counter = document.querySelector('.count[data-group="' + group + '"]');
      if (counter) counter.textContent = done + '/' + boxes.length;
    });
  }

  allBoxes.forEach(b => b.addEventListener('change', update));
  update();
</script>

</body>
</html>
